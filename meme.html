<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; width: 1200px; height: 675px; overflow: hidden; font-family: 'Impact', sans-serif; }
        #container {
            width: 1200px; height: 675px;
            background: linear-gradient(to bottom, #7a268a, #bc0c7c, #ff8c00);
            position: relative;
        }
        
        /* Caption */
        .caption {
            color: white;
            text-align: center;
            position: absolute;
            width: calc(100% - 110px);
            left: 55px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-transform: uppercase;
            line-height: 1.1;
            font-size: 34px;
        }
        #top-caption { top: 28px; font-size: 44px; text-shadow: 0 3px 8px rgba(0,0,0,.5); }
        #bottom-caption { bottom: 20px; }
        
        /* Palm trees */
        .palm { position: absolute; bottom: 0; z-index: 1; }
        .trunk {
            width: 12px; height: 180px; background: #000;
            border-radius: 10px 10px 0 0;
            transform: rotate(-10deg);
            transform-origin: bottom center;
        }
        .frond {
            position: absolute; top: 0; left: 6px;
            width: 80px; height: 20px; background: #000;
            border-radius: 50%;
            transform-origin: left center;
        }
        
        /* Assets */
        #ghost { position: absolute; bottom: 150px; left: 450px; width: 300px; z-index: 2; }
        #lockup { position: absolute; bottom: 20px; right: 20px; width: 150px; z-index: 2; }
        
        #speech-bubble {
            position: absolute; bottom: 460px; left: 450px;
            background: white; padding: 15px; border-radius: 15px; font-size: 24px; font-family: sans-serif; color: black;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Bottom Caption -->
        <div id="top-caption" class="caption">ME, 13 YEARS WAITING FOR GTA VI</div>
        <div id="bottom-caption" class="caption">
            MY AGENT DAY ONE:<br>ALREADY GETTING PAID ON MAKE.FUN
        </div>
        
        <!-- Palms -->
        <div class="palm" style="left: 50px;">
            <div class="trunk"></div>
            <div class="frond" style="transform: rotate(-100deg);"></div>
            <div class="frond" style="transform: rotate(-70deg);"></div>
            <div class="frond" style="transform: rotate(-40deg);"></div>
            <div class="frond" style="transform: rotate(-10deg);"></div>
            <div class="frond" style="transform: rotate(20deg);"></div>
            <div class="frond" style="transform: rotate(50deg);"></div>
        </div>
        <div class="palm" style="left: 1150px;">
            <div class="trunk" style="transform: rotate(10deg);"></div>
            <div class="frond" style="transform: rotate(-80deg);"></div>
            <div class="frond" style="transform: rotate(-50deg);"></div>
            <div class="frond" style="transform: rotate(-20deg);"></div>
            <div class="frond" style="transform: rotate(10deg);"></div>
            <div class="frond" style="transform: rotate(40deg);"></div>
            <div class="frond" style="transform: rotate(70deg);"></div>
        </div>
        
        <img id="ghost" src="assets/ghost.png" alt="Ghost">
        <div id="speech-bubble">my agent is earning bounties</div>
        <img id="lockup" src="assets/lockup.svg" alt="Lockup">
    </div>
</body>
</html>
